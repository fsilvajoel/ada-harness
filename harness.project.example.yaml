# Molde da configuração que o projeto alvo mantém na raiz dele, como `harness.project.yaml`.
# Caminhos relativos à raiz do projeto. Troque os <...>.
harness: <caminho até o harness>
skill_dir: <pasta compartilhada de skills; por padrão <harness>/skill>
skill_link: <caminho local que a ferramenta exige, link simbólico para skill_dir; omita se não precisa>

# Idioma (policy/idioma.md).
language:
  docs: pt-BR
  code: en
  commits: en

# Papel -> definição no adaptador da ferramenta (adapter/). O orquestrador é qualquer agente de IA.
roles:
  orchestrator: {agent: null}
  planner: {agent: <definição do papel>}
  refiner: {agent: <definição do papel>, worker: <nome do trabalhador cli-agent (opcional)>}
  test-writer: {agent: <definição do papel>}
  reviewer: {agent: <definição do papel>, second_opinion: <nome do trabalhador cli-agent (opcional)>}
  implementer: {agent: <definição do papel>, worker: <nome do trabalhador (opcional)>}

# Trabalhadores: um mapa em linha por trabalhador.
# api-chat (adapter/api-chat.md): modelo por API de chat, sem ferramentas. A chave só existe no ambiente do
# orquestrador (key_env), carregada pelo humano a partir de key_file; nunca aqui.
# cli-agent (adapter/cli-agent.md): agente de linha de comando que roda numa cópia de trabalho.
workers:
  <nome>: {adapter: api-chat, base_url: "<url da API>", model: "<modelo>", key_env: <VARIAVEL_DA_CHAVE>, key_file: <arquivo de segredos>, quota_url: "<url da consulta de cota>", quota_remaining: "<caminho jq das requisições restantes>", quota_reserve: <folga mínima>, max_attempts: 6, timeout_s: <segundos>}
  <outro nome>: {adapter: cli-agent, command: <programa>, read_args: "<argumentos do modo leitura>", write_args: "<argumentos do modo escrita>", output_jq: "<filtro jq da resposta final (opcional)>", usage_jq: "<filtro jq do consumo (opcional)>", roles: "<papéis permitidos>", max_attempts: 6, timeout_s: <segundos>}

# Arquivos de regras (tipagem, lint) que entram no pedido ou no briefing do trabalhador, por papel.
role_context:
  implementer:
    - <arquivo de regras do projeto>
  refiner:
    - <arquivo de regras do projeto>

# Skills que cada papel lê SEMPRE, antes de começar (nomes de pastas de skill_dir). O executor injeta essas skills no
# pedido de quem não tem ferramentas; o molde do agente com ferramentas manda ler as mesmas.
# Skills extras por tarefa vêm do campo `skills` do cartão (workflow/feature-artefatos/cartao.md).
role_skills:
  planner:
    - <skill>
  implementer:
    - <skill>

# Gate card-skills (gate/card-skills.md): cartões em `cards_glob` cujo allowedPaths toca um prefixo de
# `skills_required_paths` precisam declarar `skills:`, e cada item precisa existir em skill_dir.
cards_glob: <glob dos arquivos de cartões, ex.: docs/plano/E*.yaml>
skills_required_paths:
  - <prefixo de caminho, ex.: o app web>

# Teto (bytes) do bloco de skills e regras injetado no pedido (padrão 40000); acima dele o executor falha.
skills_max_bytes: 40000

# Arquivo gerado pelo comando status (script/status.py); padrão status.json na raiz do projeto.
status_file: status.json

# Fila de pendências de PM do refinamento funcional (workflow/feature.md, etapa 1b): um arquivo único.
pm_queue: <arquivo da fila>

# Comandos de verificação. Workflows, skills e gates citam a chave (commands.test etc.), nunca o comando.
commands:
  test: <rodar um arquivo de teste>
  coverage: <cobertura>
  typecheck: <checagem de tipos>
  lint: <lint>
  format: <formatação>
  verify: <verificação completa>

# Ferramentas e limites dos gates mutacao e e2e (gate/mutacao.md, gate/e2e.md). Mapas inline.
gates:
  mutation: {tool: <ferramenta de mutação>, min_score: <score mínimo, 0 a 100>}
  e2e: {tool: <ferramenta e2e>}

# Gate portable: textos do projeto que não podem aparecer dentro do harness.
portable:
  forbidden:
    - <nome do projeto>
    - <caminho absoluto da máquina>

checks:
  - portable
  - skill-format
  - card-skills
  - role-skills
